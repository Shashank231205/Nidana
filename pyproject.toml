[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nidana"
version = "0.1.0"
description = "On-premise clinical intelligence platform for Indian healthcare"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

# Speech recognition. Separate from the base install because the weights are
# large and a deployment that only reads typed input does not need them.
asr = [
    "faster-whisper>=1.0",
]

# Optical character recognition for prescription images. Needs the Tesseract
# binary from the distribution as well as these bindings.
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

# Building the knowledge index. Build-time only: the clinic's runtime reads the
# index this produces and never parses a PDF.
knowledge = [
    "pypdf>=4.0",
]

dev = [
    "mypy>=1.9",
    "ruff>=0.3",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "types-PyYAML",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["spine*", "services*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# disallow_any_explicit is deliberately absent. Pydantic's ConfigDict is typed
# with Any internally, so the flag reports every `class X(BaseModel)` line in
# the schemas package and hides real findings. disallow_any_expr below catches
# Any in our own code, which is the intent.
disallow_any_expr = false
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

# FastAPI is an optional extra. Where it is not installed, its absence is a
# missing dependency rather than a type error, and CI installs it.
[[tool.mypy.overrides]]
module = ["fastapi.*", "starlette.*"]
ignore_missing_imports = true

# faster-whisper and huggingface_hub ship no py.typed marker. Both are optional
# extras used behind an interface this repo defines and types itself.
#
# pyannote.audio and torch are the same case and are additionally heavy: torch
# alone is a 2GB download, and CI does not install it. The diarisation module
# imports both lazily behind a Protocol this repo defines, so their absence
# costs nothing but an unresolved name here.
#
# pypdf is used by one build script that turns source PDFs into the knowledge
# index. That script runs on a machine that has the PDFs; CI has neither, and
# type checking the script does not need the library present.
[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "pypdf",
    "pypdf.*",
    "huggingface_hub.*",
    "pytesseract.*",
    "PIL.*",
    "pyannote",
    "pyannote.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true

# FastAPI's route decorators are untyped in some versions. The handlers
# themselves are fully annotated; the decorator is what mypy objects to.
[[tool.mypy.overrides]]
module = "services.*.api.*"
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["spine", "services"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
