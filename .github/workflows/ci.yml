name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check spine services tests scripts

      - name: Type check
        run: mypy spine services tests scripts

      - name: Test
        run: pytest tests/ -q

      # The gate that cannot be skipped. Every rule atom must resolve to a
      # loaded predicate; an unresolved one produces a rule that cannot fire
      # and reports green on its negative tests.
      - name: Verify rule integrity
        run: python scripts/verify_rules.py

      # The boundaries erode one convenient import at a time, each individually
      # reasonable. Checked rather than reviewed.
      - name: Verify architectural boundaries
        run: python scripts/verify_boundaries.py

      - name: Clinical layer coverage
        run: |
          pytest tests/ -q \
            --cov=services.consult.clinical \
            --cov=spine.rules \
            --cov=spine.audit \
            --cov-report=term-missing \
            --cov-fail-under=95

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build is the only thing that catches an import a test never
      # reaches, and it is what a deployment actually serves.
      - name: Build
        run: npm run build
