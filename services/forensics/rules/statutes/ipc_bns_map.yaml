# IPC 1860 to BNS 2023 correspondence, for the sections a medico-legal report
# cites.
#
# TRANSCRIBED, NOT LEGALLY REVIEWED. Every row below is copied from the
# official correspondence table published by the Bureau of Police Research and
# Development and reproduced by state police forces. That table is itself, in
# its own words, a reference document and not a statutory instrument: it
# carries no legal force.
#
# What this file is for: a report written before 1 July 2024 cites IPC numbers
# and a report written after cites BNS numbers, and a reader of the archive
# needs to know they are the same provision. It answers "what is this section
# now called". It does not answer "which section applies to this injury" —
# that is the legal classification question, it is what the service README
# lists as blocked, and nothing here changes that.
#
# The BNS renumbered comprehensively: IPC had 511 sections, BNS has 358, and no
# section kept its number. A stale number in a medico-legal document is not a
# cosmetic error; it points a court at the wrong provision.
#
# source: Corresponding Section Table of Bharatiya Nyaya Sanhita 2023,
#   Bureau of Police Research and Development, reproduced at
#   https://uppolice.gov.in/site/writereaddata/siteContent/Three%20New%20Major%20Acts/202406281710564823BNS_IPC_Comparative.pdf
# transcribed_on: 2026-09-09
# legally_reviewed: false

name: forensics_ipc_bns_correspondence
