# Cardiorespiratory red flags.
#
# EVERY RULE IN THIS FILE IS UNVERIFIED. The criteria below name the clinical
# pattern each rule is meant to detect; the specific combinations have not been
# checked against a current published guideline by a qualified clinician.
#
# verify_before_ship: true on every rule. A release build refuses to start while
# any rule still carries it. Do not remove the flag without recording the
# reviewer and the date in verified_on.
name: consult_red_flags_cardiorespiratory
version: 0.1.0

rules:
  - id: RF_ACS_001
    label: Possible acute coronary syndrome
    any_of:
      - all_of: [chest_pain_present, pain_radiates_to_jaw_or_left_arm]
      - all_of: [chest_pain_present, diaphoresis_present]
      - all_of: [chest_pain_present, dyspnoea_present, age_over_40]
      - all_of: [chest_pain_present, pain_character_pressure_or_tightness, pain_worse_on_exertion]
    modifiers:
      escalate_if: [age_over_60]
    action: TERMINATE_EMERGENCY
    source: >-
      PLACEHOLDER pending clinician review. Intended sources: NICE CG95 (chest
      pain of recent onset), AHA/ACC acute coronary syndrome guidance. Neither
      has been checked; the combinations above are structural, not verified.
    verify_before_ship: true
    notes: >-
      Diabetes is common and long-standing in this population and silent or
      atypical presentation is more likely, which argues for a lower threshold
      here than the source guidelines assume. That adjustment is a clinical
      decision and has not been made.
    # panel review for RF_ACS_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-09
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "emergency physician"
      dossier_path: "docs/verification/panel/RF_ACS_001.md"

  - id: RF_AORTIC_001
    label: Possible aortic dissection
    any_of:
      - all_of: [chest_pain_present, pain_character_tearing]
      - all_of: [chest_pain_present, pain_radiates_to_back, pain_onset_sudden]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_AORTIC_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-09
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "clinical guideline review"
      dossier_path: "docs/verification/panel/RF_AORTIC_001.md"
      concerns:
        - "Missed presentation** – The rule will not fire for patients who experience *tearing‑type back pain* without any accompanying chest pain. This is a realistic clinical scenario, especially in low‑resource settings where patients may not describe pain in Western terms."
        - "Potential over‑referral** – Patients who meet the encoded criteria (chest pain + tearing pain *or* chest pain + radiates to back + sudden onset) but do **not** have aortic dissection may be unnecessarily escalated to emergency imaging or ICU care, incurring unnecessary resource use."
        - "Schema limitation** – The available predicate set does not include a dedicated flag for “tearing‑type abdominal pain” (e.g., `abdominal_pain_character_tearing_present`). Consequently, the rule cannot fully capture the canonical presentation of aortic dissection without forcing a chest‑pain prerequisite."
        - "Emergency Physician** argues that the rule should be kept as‑is because:"
        - "It aligns with guideline‑driven safety (tearing chest pain is a strong indicator of aortic dissection)."
        - "It avoids false positives in patients who may have other severe abdominal conditions."
        - "Safety Engineer** argues that the rule should be relaxed to allow detection solely on the combination of `pain_radiates_to_back` and `pain_onset_sudden`, even without chest pain, because:"
        - "Many aortic dissection patients present with isolated back pain."
        - "Retaining the chest‑pain gate may lead to missed diagnoses, especially in populations where chest pain is under‑reported."

  - id: RF_PE_001
    label: Possible pulmonary embolism
    any_of:
      - all_of: [dyspnoea_present, pain_onset_sudden, unilateral_leg_swelling]
      - all_of: [dyspnoea_present, haemoptysis_present, pain_onset_sudden]
      - all_of: [chest_pain_present, dyspnoea_present, recent_immobility_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_PE_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "clinical-pathology specialist"
      dossier_path: "docs/verification/panel/RF_PE_001.md"
      concerns:
        - "Missed cases – The rule fails to fire for patients who present with dyspnoea and unilateral leg swelling but lack chest‑pain or haemoptysis. This is a real clinical gap, especially in populations (e.g., diabetics with COPD in India) where chest pain is not a reliable symptom of PE."
        - "Over‑referral risk – Patients who truly have PE (e.g., classic chest‑pain‑plus‑dyspnoea‑plus‑recent‑immobility) will be correctly flagged, but the rule’s reliance on chest pain may cause unnecessary escalation for atypical presentations, potentially delaying care for those who would benefit from earlier imaging."
        - "Schema limitation – The rule does not capture “recent immobility” as a binary flag; it expects a documented period (e.g., “bedridden for >24 h”), which may not be recorded in all clinical notes. This could lead to missed cases even when the presentation is otherwise appropriate."
        - "Emergency physician (Western‑focused) argues that the rule’s inclusion of chest‑pain and haemoptysis is justified because these are common and readily documented in many emergency settings, reducing false‑positive imaging referrals."
        - "Indian practice reviewer contends that in Indian district hospitals, a high proportion of PE cases present without chest pain (e.g., diabetics with COPD), and the rule’s requirement for chest pain may lead to missed diagnoses, increasing morbidity and mortality."
        - "Safety engineer suggests that the rule’s narrowness may cause over‑referral for patients who truly have PE (e.g., classic chest‑pain‑plus‑dyspnoea‑plus‑immobility), potentially delaying necessary care for those with atypical presentations."

  - id: RF_RESP_FAILURE_001
    label: Respiratory compromise
    any_of:
      - all_of: [unable_to_speak_sentences]
      - all_of: [stridor_present]
      - all_of: [breathless_at_rest, altered_consciousness_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_RESP_FAILURE_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "emergency physician"
      dossier_path: "docs/verification/panel/RF_RESP_FAILURE_001.md"

  - id: RF_ANAPHYLAXIS_001
    label: Possible anaphylaxis
    any_of:
      - all_of: [lip_or_tongue_swelling_present, breathing_difficulty_present]
      - all_of: [lip_or_tongue_swelling_present, stridor_present]
      - all_of: [allergen_exposure_present, rash_present, breathing_difficulty_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_ANAPHYLAXIS_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "Emergency Medicine / Critical Care"
      dossier_path: "docs/verification/panel/RF_ANAPHYLAXIS_001.md"

  - id: RF_SYNCOPE_001
    label: Syncope with cardiac features
    any_of:
      - all_of: [syncope_present, chest_pain_present]
      - all_of: [syncope_present, palpitations_present]
      - all_of: [syncope_present, pain_worse_on_exertion]
    action: ESCALATE_BAND
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_SYNCOPE_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "cardiologist or emergency medicine specialist familiar with cardiac syncope patterns in diverse populations"
      dossier_path: "docs/verification/panel/RF_SYNCOPE_001.md"
      concerns:
        - "Missed case – The rule fails to trigger for patients whose syncope is driven by mechanisms other than the three explicitly coded cardiac features (chest pain, palpitations, or exertional pain)."
        - "Emergency physician*: Misses patients with arrhythmogenic collapse or vasovagal syncope who present without chest pain, palpitations, or exertional pain."
        - "Indian practice reviewer*: Misses a substantial subset of cardiac syncope in Indian district hospitals caused by hypertensive heart disease, which often presents without classic cardiac‑pain or exertional‑pain cues."
        - "Safety engineer*: Misses patients with atrial fibrillation‑related syncope (no chest pain) and other exertional‑only syncope mechanisms, potentially delaying anticoagulation or rhythm‑control therapy."
        - "Over‑referral – The rule does not over‑refer in the current form; it simply fails to fire for atypical presentations. However, expanding the rule to include exertional syncope alone could increase false‑positive escalations, especially in low‑resource settings where many exertional syncopes are due to decompensated heart failure or arrhythmias without overt cardiac‑pain symptoms."
        - "Decision point – Whether to modify the rule to capture exertional syncope as a primary trigger (e.g., `syncope_present` alone) while retaining the existing cardiac‑feature branches for differentiation, or to keep the rule as‑is to avoid unnecessary escalations."
        - "Emergency physician argues that the rule is sufficient for the most common presentation of cardiac‑related syncope (chest pain, palpitations, or exertional pain) and that expanding it would increase false‑positive referrals, potentially delaying care for patients whose syncope is truly cardiac but without the three specific features."
        - "Indian practice reviewer contends that the current rule misses a high‑risk population (hypertensive heart disease) where exertional syncope is prevalent and often untreated, justifying an expansion to capture exertional syncope alone."
        - "Safety engineer emphasizes the risk of missing arrhythmia‑related syncope (e.g., atrial fibrillation) and the potential for delayed anticoagulation, suggesting that the rule should be broadened to include rhythm or heart‑rate criteria."

  - id: RF_HAEMOPTYSIS_001
    label: Significant haemoptysis
    any_of:
      - all_of: [haemoptysis_present, dyspnoea_present]
      - all_of: [haemoptysis_present, chest_pain_present]
    action: ESCALATE_BAND
    source: >-
      PLACEHOLDER pending clinician review. Tuberculosis prevalence in this
      population changes the differential materially; a clinician should set the
      threshold with that in mind.
    verify_before_ship: true
