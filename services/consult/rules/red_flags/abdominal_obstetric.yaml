      escalate_if: [dizziness_or_fainting_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_OBSTETRIC_BLEED_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-09
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "emergency physician"
      dossier_path: "docs/verification/panel/RF_OBSTETRIC_BLEED_001.md"

  - id: RF_PRE_ECLAMPSIA_001
    label: Features suggesting pre-eclampsia
    any_of:
      - all_of: [obstetric_visual_disturbance, pregnancy_confirmed_status]
      - all_of: [epigastric_pain_present, pregnancy_confirmed_status]
      - all_of: [swelling_face_or_hands_present, obstetric_visual_disturbance]
