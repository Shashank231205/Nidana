    source: >-
      PLACEHOLDER pending clinician review. No blood pressure threshold is
      encoded here because Consult does not measure blood pressure; this rule
      turns on reported symptoms only.
    verify_before_ship: true
    # panel review for RF_PRE_ECLAMPSIA_001: a record that the reading was
