# Sepsis, paediatric, mental health risk, and trauma red flags.
#
# EVERY RULE IN THIS FILE IS UNVERIFIED. See cardiorespiratory.yaml.
name: consult_red_flags_systemic_risk
version: 0.1.0

rules:
  - id: RF_SEPSIS_001
    label: Sepsis screen positive
    any_of:
      - all_of: [fever_reported_present, altered_consciousness_present]
      - all_of: [fever_reported_present, rigors_present, urine_output_reduced_or_absent]
      - all_of: [fever_reported_present, breathing_difficulty_present]
      - all_of: [fever_reported_present, rash_present, immunosuppression_known_present]
    modifiers:
      escalate_if: [age_over_60, age_under_5, immunosuppression_known_present]
    action: TERMINATE_EMERGENCY
    source: >-
      PLACEHOLDER pending clinician review. Consult takes no observations, so
      this screen turns on reported symptoms rather than on a physiological
      score. A clinician should decide whether that is sufficient or whether
      this rule should be widened.
    verify_before_ship: true
    # panel review for RF_SEPSIS_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "clinical informatics specialist familiar with sepsis guidelines"
      dossier_path: "docs/verification/panel/RF_SEPSIS_001.md"
      concerns:
        - "Missed patients exist."
        - "The emergency physician identified a 58‑year‑old male with Crohn’s disease who presents with fever and severe abdominal pain but lacks altered consciousness, rigors, dyspnea, or rash."
        - "The safety engineer highlighted patients who meet sepsis physiological criteria (hypotension, tachypnea, reduced urine output, immunosuppression) yet do not report fever, such as a 45‑year‑old immunocompromised male and a 12‑year‑old postoperative female."
        - "The Indian practice reviewer noted that many septic patients in low‑resource Indian settings present without fever (e.g., abdominal sepsis, atypical pneumonia, intra‑abdominal infection) and that the rule’s age thresholds and fever requirement may miss these cases."
        - "Over‑referrals are possible."
        - "The emergency physician’s example (fever present but no altered consciousness) shows the rule could terminate the emergency session for patients who do not truly require escalation, potentially wasting resources."
        - "The safety engineer’s example of a mildly febrile patient with no other sepsis signs illustrates that the rule may fire unnecessarily, leading to unnecessary termination."
        - "The rule’s design is overly restrictive."
        - "All three reviewers agree that the rule’s reliance on fever_reported_present as the primary trigger is insufficient for detecting sepsis in populations where fever is absent or under‑reported."
        - "The inclusion of ancillary criteria (altered consciousness, rigors, reduced urine output, breathing difficulty, rash) is not sufficient to capture the full spectrum of sepsis presentations in the Indian context."
        - "Emergency physician: Argues that the rule should be expanded to include abdominal pain as a valid sepsis indicator when combined with fever and known immunosuppressive disease (e.g., Crohn’s disease)."
        - "Safety engineer: Proposes that the rule should be revised to allow escalation based on physiological signs (hypotension, tachypnea, reduced urine output) even if fever is absent, and to retain fever only as an optional early‑warning flag."

  - id: RF_DKA_001
    label: Features suggesting diabetic ketoacidosis
    any_of:
      - all_of: [breathing_difficulty_present, vomiting_present, oral_intake_minimal_or_none]
      - all_of: [altered_consciousness_present, urine_output_reduced_or_absent, vomiting_present]
    action: TERMINATE_EMERGENCY
    source: >-
      PLACEHOLDER pending clinician review. Should almost certainly be gated on
      known diabetes, which is not yet a predicate because comorbidities are not
      a registry field. That gap is real and needs closing before this ships.
    verify_before_ship: true
    # panel review for RF_DKA_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "diabetes-status"
      dossier_path: "docs/verification/panel/RF_DKA_001.md"
      concerns:
        - "Misses – The rule will miss patients with diabetic ketoacidosis who do not present with the specific respiratory, vomiting, or oral‑intake criteria captured in the rule. This includes:"
        - "DKA without altered consciousness (e.g., classic abdominal‑pain‑vomiting DKA in a diabetic patient who is otherwise alert)."
        - "DKA with altered consciousness but without vomiting (e.g., mild DKA with confusion but no vomiting)."
        - "Non‑DKA emergencies that satisfy the rule’s branches (e.g., acute pancreatitis, severe gastroenteritis, or dehydration from fever)."
        - "Over‑referrals – The rule will also fire on non‑DKA presentations that meet the criteria, such as:"
        - "Acute pancreatitis in a diabetic patient (vomiting, minimal oral intake, respiratory distress)."
        - "Acute appendicitis or other abdominal emergencies (vomiting, minimal intake, respiratory distress)."
        - "Mild dehydration from fever (vomiting, minimal intake, respiratory distress) that does not meet DKA thresholds."
        - "Schema limitation – The rule implicitly assumes that any patient meeting the criteria is diabetic. The current registry lacks a “known_diabetes” predicate, making it impossible to distinguish DKA from other vomiting‑abdominal pain syndromes. This is a fundamental schema gap that must be addressed before the rule can be safely deployed."
        - "Emergency Physician: Argues that the rule’s narrow gating (breathing difficulty + vomiting + minimal oral intake) is acceptable because it avoids false positives in non‑DKA emergencies, thereby protecting against missed DKA. The primary concern is the risk of missing DKA that presents without vomiting or altered consciousness."
        - "Safety Engineer: Emphasizes that the rule’s current form leads to high false‑positive rates (over‑referrals), which can cause unnecessary termination of the emergency session, increased resource consumption, and potential harm from premature escalation. Suggests that the rule should be revised to include a diabetes‑status predicate before deployment."
        - "Indian Practice Reviewer: Highlights that in low‑resource settings, many DKA patients present with abdominal pain and vomiting without immediate neuro‑glycopenic changes. The absence of a diabetes field means the rule cannot reliably detect DKA, leading to missed diagnoses and delayed treatment. Recommends adding a diabetes gating criterion or a separate rule for DKA detection."

  - id: RF_DEHYDRATION_001
    label: Significant dehydration
    any_of:
      - all_of: [oral_intake_minimal_or_none, urine_output_reduced_or_absent]
      - all_of: [vomiting_present, oral_intake_minimal_or_none, age_under_5]
    modifiers:
      escalate_if: [age_under_2, age_over_60]
    action: ESCALATE_BAND
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_DEHYDRATION_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "pediatric emergency medicine specialist familiar with Indian clinical practice and resource-limited settings"
      dossier_path: "docs/verification/panel/RF_DEHYDRATION_001.md"
      concerns:
        - "Missed cases exist."
        - "The rule only escalates when *vomiting* is explicitly reported (`vomiting_present`) and oral intake is minimal."
        - "In many Indian district‑hospital patients, especially children under 5, dehydration presents primarily with vomiting (and sometimes irritability) without a documented “minimal oral intake.”"
        - "The rule therefore fails to capture a common presentation of severe dehydration in this population, potentially delaying life‑saving fluid resuscitation."
        - "Potential over‑referral."
        - "Patients who meet only the first branch (minimal oral intake + reduced urine output) but are not vomiting may still be escalated unnecessarily, increasing resource use and patient burden."
        - "Safety vs. specificity."
        - "Escalating mild dehydration cases (e.g., mild heat‑stress dehydration) can be justified in settings where IV access is readily available, but in resource‑constrained district hospitals it may lead to unnecessary transport and waste of limited resources."
        - "Emergency Physician: Argues that the rule’s current design (vomiting + minimal intake) is appropriate because it aligns with Western pediatric dehydration guidelines and ensures rapid escalation for life‑threatening dehydration. Any expansion could increase over‑referral and expose patients to unnecessary interventions."
        - "Safety Engineer: Points out that the rule’s narrow trigger may miss clinically significant dehydration in older adults and children who vomit but do not report minimal oral intake, leading to delayed treatment of severe dehydration. However, they caution that broadening the rule could also cause over‑referral, especially for mild cases."
        - "Indian Practice Reviewer: Emphasizes the cultural and environmental context—heat‑related dehydration is common in Indian settings and often manifests as vomiting without explicit reporting of “minimal oral intake.” They contend that the current rule under‑triages many patients, risking missed severe dehydration."

  - id: RF_PAEDIATRIC_DANGER_001
    label: Paediatric danger signs
    any_of:
      - all_of: [age_under_5, altered_consciousness_present]
      - all_of: [age_under_5, breathing_difficulty_present]
      - all_of: [age_under_5, oral_intake_minimal_or_none]
      - all_of: [age_under_5, seizure_present]
    action: TERMINATE_EMERGENCY
    source: >-
      PLACEHOLDER pending clinician review. Intended source: WHO IMCI danger
      signs. Not checked.
    verify_before_ship: true
    # panel review for RF_PAEDIATRIC_DANGER_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "emergency physician"
      dossier_path: "docs/verification/panel/RF_PAEDIATRIC_DANGER_001.md"

  - id: RF_UNDER_TWO_001
    label: Child under two
    any_of:
      - all_of: [age_under_2]
    action: TERMINATE_EMERGENCY
    source: >-
      Product scope decision, not a clinical criterion. Under-2 is excluded from
      the automated path because the danger-sign profile differs enough to
      warrant its own build. This rule routes to a human rather than triaging.
    verified_on: 2026-09-06
    verified_by: >-
      Repository owner, as a product scope decision. This is the one rule here
      that needs no clinical sign-off, because it routes to a human rather than
      triaging: it encodes what this system declines to do.
    verify_before_ship: false
    notes: >-
      The only rule here that is not awaiting clinical verification, because it
      encodes a scope boundary rather than a clinical threshold. It must fire
      before any other paediatric rule reasons about the child.

  - id: RF_SUICIDE_RISK_001
    label: Suicidal ideation with plan or intent
    any_of:
      - all_of: [suicidal_ideation_present, suicidal_plan_present]
      - all_of: [suicidal_ideation_present, suicidal_intent_present]
      - all_of: [self_harm_act_recent_present]
    modifiers:
      escalate_if: [means_available_present, patient_is_alone]
    action: TERMINATE_EMERGENCY
    source: >-
      PLACEHOLDER pending clinician review. Scope is detection and immediate
      escalation only; Consult does not counsel. The patient-facing message for
      this rule must route to a helpline and a human, and that message text
      needs writing with clinical input.
    verify_before_ship: true

  - id: RF_HARM_TO_OTHERS_001
    label: Stated intention to harm another person
    any_of:
      - all_of: [harm_to_others_ideation_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true

  - id: RF_TRAUMA_MAJOR_001
    label: Major trauma mechanism or compromise
    any_of:
      - all_of: [penetrating_mechanism]
      - all_of: [high_energy_mechanism, loss_of_consciousness_present]
      - all_of: [bleeding_active_present, dizziness_or_fainting_present]
      - all_of: [loss_of_consciousness_present, vomiting_since_injury_present]
    modifiers:
      escalate_if: [anticoagulant_use_present, age_over_60]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true

  - id: RF_HEAD_INJURY_001
    label: Head injury with concerning features
    any_of:
      - all_of: [head_injury_recent_present, amnesia_for_event_present]
      - all_of: [head_injury_recent_present, vomiting_since_injury_present]
      - all_of: [head_injury_recent_present, anticoagulant_use_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
