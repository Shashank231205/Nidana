# Neurological red flags.
#
# EVERY RULE IN THIS FILE IS UNVERIFIED. See cardiorespiratory.yaml for what
# that means and what must happen before any of these ship.
name: consult_red_flags_neurological
version: 0.1.0

rules:
  - id: RF_STROKE_001
    label: Possible stroke
    any_of:
      - all_of: [face_asymmetry_present, neurological_onset_sudden]
      - all_of: [arm_weakness_present, neurological_onset_sudden]
      - all_of: [speech_disturbance_present, neurological_onset_sudden]
      - all_of: [visual_loss_present, neurological_onset_sudden]
    modifiers:
      escalate_if: [anticoagulant_use_present]
    action: TERMINATE_EMERGENCY
    source: >-
      PLACEHOLDER pending clinician review. Intended source: FAST screening plus
      current stroke guidance. Not checked.
    notes: >-
      last_known_well_hours is a required field for this family and is captured
      to the clock, because reperfusion eligibility times from it rather than
      from when the deficit was noticed. This rule does not encode the window;
      the window is a clinical threshold and needs a verified source before it
      is written anywhere.
    verify_before_ship: true
    # panel review for RF_STROKE_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "emergency physician"
      dossier_path: "docs/verification/panel/RF_STROKE_001.md"

  - id: RF_TIA_001
    label: Resolved focal neurological deficit
    any_of:
      - all_of: [deficit_resolved, face_asymmetry_present]
      - all_of: [deficit_resolved, arm_weakness_present]
      - all_of: [deficit_resolved, speech_disturbance_present]
    action: ESCALATE_BAND
    source: PLACEHOLDER pending clinician review.
    notes: >-
      A patient whose symptoms have resolved is still time-critical. Feeling
      better now is not reassurance, and the intake agent must not treat it as
      such.
    verify_before_ship: true
    # panel review for RF_TIA_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "emergency physician"
      dossier_path: "docs/verification/panel/RF_TIA_001.md"

  - id: RF_SAH_001
    label: Thunderclap headache
    any_of:
      - all_of: [headache_worst_ever, neurological_onset_sudden]
      - all_of: [headache_worst_ever, vomiting_present]
      - all_of: [headache_worst_ever, neck_stiffness_present]
    action: TERMINATE_EMERGENCY
    source: >-
      PLACEHOLDER pending clinician review. time_to_peak_minutes is captured as
      its own required field so that a verified time-to-peak criterion can be
      added here without a schema change.
    verify_before_ship: true
    # panel review for RF_SAH_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "neurology/trauma specialist"
      dossier_path: "docs/verification/panel/RF_SAH_001.md"
      concerns:
        - "Missed cases exist."
        - "The rule will not fire for patients who experience a thunderclap headache without vomiting, neck stiffness, or a documented “worst‑ever” intensity. Such presentations are common in acute subarachnoid hemorrhage (SAH) and can be missed if the clinician relies solely on the current criteria."
        - "Potential over‑referral."
        - "Patients who truly have a severe thunderclap headache with vomiting or neck stiffness will be escalated unnecessarily, leading to unnecessary imaging or admission."
        - "Schema limitation."
        - "The rule depends on the existence of a `headache_worst_ever` predicate, which is not present in the current predicate registry. This suggests a need for a new or expanded data capture field to reliably encode severity descriptors."
        - "Temporal capture is missing."
        - "The `time_to_peak_minutes` field, which could help differentiate a true thunderclap headache from a sub‑acute bleed, is not yet implemented."

  - id: RF_MENINGISM_001
    label: Possible meningitis
    any_of:
      - all_of: [neck_stiffness_present, fever_reported_present]
      - all_of: [neck_stiffness_present, photophobia_present]
      - all_of: [fever_reported_present, rash_present, altered_consciousness_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_MENINGISM_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "clinician specializing in infectious diseases and emergency medicine"
      dossier_path: "docs/verification/panel/RF_MENINGISM_001.md"
      concerns:
        - "Missed cases – The rule will miss patients who present with severe headache, neck stiffness, and altered consciousness but have no fever. Such patients (e.g., a 45‑year‑old male with bacterial meningitis) will not trigger the rule because fever is a mandatory component."
        - "Potential over‑referrals – Patients who have fever, neck stiffness, and a mild rash (even if the rash is not severe) will be escalated to emergency care, potentially leading to unnecessary neurosurgical intervention and resource waste."
        - "Clinical context matters – In resource‑limited district hospitals in India, fever may be absent in a substantial proportion of bacterial meningitis cases, making the rule’s reliance on fever a significant limitation."
        - "Emergency Physician: Argues that the rule should be broadened to include severe neck stiffness alone (or combined with altered consciousness) to capture missed cases, even if fever is absent."
        - "Safety Engineer: Proposes that the rule’s label should be expanded to “suspected meningitis” and that the rule should not be triggered solely on fever, as this reduces false‑negative risk."
        - "Indian Practice Reviewer: Suggests that the rule should be relaxed to allow detection without fever, acknowledging that the current design may miss a large subset of meningitis cases in this population."

  - id: RF_RAISED_ICP_001
    label: Features suggesting raised intracranial pressure
    any_of:
      - all_of: [headache_visual_disturbance, vomiting_present]
      - all_of: [focal_weakness_present, headache_worst_ever]
      - all_of: [head_injury_recent_present, altered_consciousness_present]
    modifiers:
      escalate_if: [anticoagulant_use_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_RAISED_ICP_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "emergency physician"
      dossier_path: "docs/verification/panel/RF_RAISED_ICP_001.md"
      concerns:
        - "The rule may miss patients with sub‑arachnoid hemorrhage who present with severe headache and vomiting but lack focal neurological deficits."
        - "The rule could potentially over‑fire on patients with gastro‑oesophageal reflux disease, leading to unnecessary termination of the emergency session."
        - "Emergency Physician vs. Indian Practice Reviewer: Whether the rule’s current symptom combination (headache + vomiting) is sufficient to capture SAH presentations, especially in delayed presentations typical of low‑resource settings."
        - "Safety Engineer vs. Emergency Physician: Whether the rule should be expanded to include altered consciousness without requiring focal neurological signs, and if so, whether the escalation action should be modified."
        - "Refer to: A neurology specialist to address the missed SAH cases and to refine the rule’s criteria to align with local epidemiology and resource constraints."

  - id: RF_SEIZURE_001
    label: Seizure activity
    any_of:
      - all_of: [seizure_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_SEIZURE_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "clinical neurology/ emergency medicine specialist"
      dossier_path: "docs/verification/panel/RF_SEIZURE_001.md"
      concerns:
        - "Missed cases – The rule will terminate the emergency session for patients who present with generalized tonic‑clonic seizures but do not describe “seizure activity” (jerking, loss of consciousness) in the voice‑recorded narrative. Such subtle presentations (altered consciousness, rigors) are captured by predicates like `altered_consciousness_present` or `rigors_present`, which are not part of the current `seizure_present` flag. Consequently, patients with status epilepticus or febrile seizures may be discharged without the needed emergent work‑up."
        - "Over‑referral risk – Patients who present with chest pain, dyspnea, or other systemic signs unrelated to seizure activity will also trigger termination because the rule’s single firing condition is met. This could unnecessarily consume resources and cause patient anxiety."
        - "Emergency physician: Argues that expanding the rule to include `altered_consciousness_present`, `rigors_present`, or similar descriptors would capture missed seizures (e.g., subtle altered consciousness in children or febrile seizures) without increasing unnecessary terminations."
        - "Safety engineer: Warns that broadening the rule could lead to over‑referral on patients who do not truly need emergency termination (e.g., chest‑pain‑only patients), potentially increasing resource utilization and ICU bed occupancy."

  - id: RF_TEMPORAL_ARTERITIS_001
    label: Features suggesting temporal arteritis
    any_of:
      - all_of: [scalp_tenderness_present, age_over_50]
      - all_of: [jaw_claudication_present, age_over_50]
      - all_of: [headache_visual_disturbance, scalp_tenderness_present]
    action: ESCALATE_BAND
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
    # panel review for RF_TEMPORAL_ARTERITIS_001: a record that the reading was
    # done, not a verification. This rule still blocks a release.
    review:
      reviewed_on: 2026-09-10
      models: [granite4.1:3b]
      panel_version: 1.0.0
      refer_to: "emergency physician"
      dossier_path: "docs/verification/panel/RF_TEMPORAL_ARTERITIS_001.md"

  - id: RF_VISION_LOSS_001
    label: Acute vision loss
    any_of:
      - all_of: [visual_loss_present]
    action: TERMINATE_EMERGENCY
    source: PLACEHOLDER pending clinician review.
    verify_before_ship: true
